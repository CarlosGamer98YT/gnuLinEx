# /etc/calamares/modules/shellprocess.conf
i18n:
     name: "Configurando y limpiando el sistema..."

dontChroot: false
timeout: 300
script:
    - command: "echo '####################################################################'"
    - command: "/usr/local/bin/limpieza-gnulinex.sh"
    - command: "/etc/calamares/scripts/config-postinstall.sh"
    - command: "userdel -r user || true"
    - command: "rm -f /etc/lightdm/lightdm.conf.d/01_autologin.conf"
