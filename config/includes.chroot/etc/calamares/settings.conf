# Configuration file for Calamares
# Syntax is YAML 1.2
---

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
# Phase 1 - prepare.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall
  - summary

# Phase 2 - install.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - netinstall         # <-- 1. Prepara la lista de paquetes del sabor elegido
  - packages           # <-- 2. Instala los paquetes (incluyendo gdm3, sddm, etc.)
  - shellprocess       # <-- 3. Limpieza de XFCE y entornos no elegidos, configuración de usuarios
  - displaymanager     # <-- 4. Detecta y configura el gestor instalado y el entorno único restante
  - services-systemd   # <-- 5. Habilita los servicios de los nuevos paquetes
  - bootloader-config
  - grubcfg
  - bootloader
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

# Phase 3 - postinstall.
- show:
  - finished

branding: debian
prompt-install: false
dont-chroot: false
