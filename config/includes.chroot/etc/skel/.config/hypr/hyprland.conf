# ##############################################################################
# Configuración de Hyprland - gnuLinEx (Grulla)
# Edición "Dehesa y Granito" - Inspiración Extremeña
# Compatible con Hyprland 0.50+ a 0.56+ / 0.57+
# ##############################################################################

# Desactivar aviso de configuración predeterminada
autogenerated = 0

# Configuración universal de monitores (adaptación automática sobremesa / portátil)
monitor = , preferred, auto, 1

# Variables de aplicaciones predeterminadas del sistema
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$lockscreen = gnulinex-lock
$powermenu = gnulinex-powermenu

# ==============================================================================
# Autostart (Programas de inicio)
# ==============================================================================
exec-once = gnulinex-wallpaper
exec-once = waybar
exec-once = mako
exec-once = swayidle -w timeout 600 'gnulinex-lock' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'gnulinex-lock'
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 || /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store || true
exec-once = gnulinex-hardware-detect
exec-once = gnulinex-battery-monitor &

# ==============================================================================
# Variables de Entorno (Wayland / Qt / GTK)
# ==============================================================================
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ==============================================================================
# Entrada y Teclado
# ==============================================================================
input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = true
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.85
    }

    sensitivity = 0 # -1.0 a 1.0, 0 sin aceleración artificial
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
}

# ==============================================================================
# Apariencia General (Paleta: Dehesa y Granito)
# ==============================================================================
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Gradiente corporativo: Verde Encina (#2f6a4e) a Oro Romano (#d4a359)
    col.active_border = rgba(2f6a4eee) rgba(d4a359ee) 45deg
    col.inactive_border = rgba(2c3932aa)

    layout = dwindle
    allow_tearing = false
}

# ==============================================================================
# Decoración (Esquinas redondeadas, sombras y desenfoque suave)
# ==============================================================================
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000045)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        vibrancy = 0.18
    }
}

# ==============================================================================
# Animaciones (Rápidas, ligeras y elegantes)
# ==============================================================================
animations {
    enabled = true

    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = smoothOut, 0.25, 0.9, 0.3, 1
    bezier = linear, 0, 0, 1, 1

    animation = global, 1, 8, default
    animation = border, 1, 4.5, easeOutExpo
    animation = windows, 1, 4.0, easeOutExpo
    animation = windowsIn, 1, 3.8, easeOutExpo, popin 88%
    animation = windowsOut, 1, 3.2, smoothOut, popin 88%
    animation = fadeIn, 1, 2.0, linear
    animation = fadeOut, 1, 1.8, linear
    animation = fade, 1, 2.5, easeOutExpo
    animation = layers, 1, 3.5, easeOutExpo
    animation = layersIn, 1, 3.5, easeOutExpo, fade
    animation = layersOut, 1, 1.8, linear, fade
    animation = workspaces, 1, 4.0, easeOutExpo, slide
    animation = specialWorkspace, 1, 4.0, easeOutExpo, slidevert
}

# ==============================================================================
# Disposición Dwindle
# ==============================================================================
dwindle {
    preserve_split = true
    pseudotile = true
}

# ==============================================================================
# Opciones Misceláneas
# ==============================================================================
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# ==============================================================================
# Atajos de Teclado
# ==============================================================================
$mainMod = SUPER

# Lanzadores y aplicaciones
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, firefox-esr
bind = $mainMod, L, exec, $lockscreen
bind = $mainMod, ESCAPE, exec, $powermenu
bind = $mainMod, X, exec, $powermenu
bind = $mainMod SHIFT, T, exec, gnulinex-theme-toggle

# Gestión de ventanas
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Scratchpad (Espacio especial de notas / tareas rápidas)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Capturas de pantalla profesionales con gnuLinEx Screenshot
bind = , Print, exec, gnulinex-screenshot area
bind = SHIFT, Print, exec, gnulinex-screenshot full
bind = $mainMod, Print, exec, gnulinex-screenshot window

# Control de Audio (PipeWire / WirePlumber)
bindel = , XF86AudioRaiseVolume, exec, gnulinex-volume up
bindel = , XF86AudioLowerVolume, exec, gnulinex-volume down
bindl = , XF86AudioMute, exec, gnulinex-volume mute
bindl = , XF86AudioMicMute, exec, gnulinex-volume micmute

# Control de Brillo (Portátiles)
bindel = , XF86MonBrightnessUp, exec, gnulinex-brightness up
bindel = , XF86MonBrightnessDown, exec, gnulinex-brightness down

# Control Multimedia (Playerctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Cierre de tapa en portátiles (Lid Switch)
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh open

# Mover foco de ventana
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Cambiar de Espacio de Trabajo (1 - 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover Ventana Activa a Espacio de Trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Navegación entre espacios de trabajo con la rueda del ratón
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover y Redimensionar Ventanas con el Ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================================================================
# Reglas de Ventana
# ==============================================================================
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(vlc)$
windowrulev2 = float, class:^(ark)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(mate-polkit)$
windowrulev2 = float, class:^(calamares)$
windowrulev2 = idleinhibit fullscreen, class:.*
