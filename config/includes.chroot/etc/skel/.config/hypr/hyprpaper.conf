# ##############################################################################
# Configuración de Hyprpaper - gnuLinEx (Grulla)
# Compatible con hyprpaper 0.8.x
# ##############################################################################

splash = false
splash_offset = 20
splash_opacity = 0.0
ipc = true

# Fondo predeterminado en el esqueleto del usuario
wallpaper {
    monitor =
    path = ~/.config/hypr/default.png
    fit_mode = cover
}

# Fallback al fondo del sistema
wallpaper {
    monitor =
    path = /usr/share/backgrounds/default.png
    fit_mode = cover
}
