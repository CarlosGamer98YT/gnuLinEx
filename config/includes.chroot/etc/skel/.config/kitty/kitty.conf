# ##############################################################################
# Configuración de Kitty - gnuLinEx (Grulla)
# Paleta: "Dehesa y Granito" (Inspiración Extremeña)
# ##############################################################################

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor_shape     beam
cursor_blink_interval 0.5

scrollback_lines 3000

window_padding_width 10
background_opacity 0.94

# Paleta gnuLinEx (Dehesa y Granito)
background #141a17
foreground #eef4f0
selection_background #2f6a4e
selection_foreground #ffffff

# Colores (16 colores terminal)
# Negro / Granito
color0 #141a17
color8 #3c4e44

# Rojo / Barro Romano
color1 #c8564a
color9 #e06c75

# Verde / Dehesa y Encina
color2  #2f6a4e
color10 #4cae7a

# Amarillo / Oro Romano y Trigo
color3  #d4a359
color11 #e5b567

# Azul / Cielo de Alqueva
color4  #3d8dae
color12 #56a2c4

# Magenta / Flor de Brezo
color5  #9b6b9e
color13 #b882bc

# Cian / Manantial
color6  #48a396
color14 #61c0b2

# Blanco / Piedra Blanca
color7  #d8e5dc
color15 #ffffff
